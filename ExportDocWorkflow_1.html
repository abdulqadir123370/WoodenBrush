<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Document Workflow</title>
<style>
  :root{
    --navy:#0d2b52; --gold:#d4a13d; --green:#3f8f4f; --amber:#e0a324;
    --orange:#e0762b; --purple:#7c5bc4; --teal:#2ab5a8; --blue:#2f7fd4;
    --bg:#f4f6f9; --card:#ffffff; --border:#e2e6ec; --text:#1f2937; --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(120deg,var(--navy),#123a6b);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header h1{margin:0;font-size:1.3rem;letter-spacing:.5px;}
  header .sub{font-size:.78rem;color:#cfe0f7;margin-top:3px;}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px;}

  .mode-banner{background:#eef3fa;border:1px solid #c7d9f0;color:#0d2b52;padding:10px 16px;border-radius:8px;font-size:.82rem;margin-bottom:16px;}

  /* ---------- Top section tabs ---------- */
  .top-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .top-tab{background:#fff;border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:8px;font-size:.86rem;font-weight:600;cursor:pointer;}
  .top-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* ---------- Expenses / provider ledger ---------- */
  .provider-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .provider-card:hover{border-color:var(--navy);}
  .provider-card .pname{font-weight:700;color:var(--navy);font-size:1rem;}
  .provider-card .ptype{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .provider-card .balance{font-size:1rem;font-weight:700;}
  .balance.owe{color:#c0392b;}
  .balance.clear{color:var(--green);}
  .ledger-summary{display:flex;gap:24px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:18px;flex-wrap:wrap;}
  .ledger-summary .stat{}
  .ledger-summary .stat .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .ledger-summary .stat .value{font-size:1.2rem;font-weight:700;color:var(--navy);}
  .ledger-table{width:100%;border-collapse:collapse;font-size:.85rem;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .ledger-table th{background:#f1f4f8;padding:9px 10px;text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;}
  .ledger-table td{padding:9px 10px;border-top:1px solid var(--border);}
  .ledger-table .amt-charge{color:#c0392b;text-align:right;}
  .ledger-table .amt-payment{color:var(--green);text-align:right;}
  .ledger-table .amt-balance{text-align:right;font-weight:600;}
  .txn-form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:18px;}
  .txn-form h3{margin:0 0 12px;font-size:.95rem;color:var(--navy);}

  /* ---------- List view ---------- */
  .add-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .add-card h2{margin:0 0 12px;font-size:1rem;color:var(--navy);}
  .add-row{display:flex;gap:10px;flex-wrap:wrap;}
  .add-row input{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;}
  .add-row button{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:.9rem;cursor:pointer;font-weight:600;}
  .add-row button:disabled{opacity:.5;cursor:not-allowed;}

  .search{margin-bottom:16px;}
  .search input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;}

  .shipment-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .shipment-card:hover{border-color:var(--navy);}
  .shipment-card .ref{font-weight:700;color:var(--navy);font-size:1rem;}
  .shipment-card .cust{font-size:.82rem;color:var(--muted);margin-top:2px;}
  .shipment-card .right{display:flex;align-items:center;gap:14px;}
  .progress-wrap{width:100px;}
  .progress-bar{background:#e9edf3;border-radius:6px;height:8px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);transition:width .3s;}
  .progress-label{font-size:.72rem;color:var(--muted);text-align:right;margin-top:3px;}
  .del-btn{background:none;border:none;color:#c0392b;font-size:1.1rem;cursor:pointer;padding:2px 6px;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:.9rem;}

  /* ---------- Detail / wizard view ---------- */
  .back-btn{background:none;border:none;color:var(--navy);font-size:.88rem;cursor:pointer;font-weight:600;padding:0 0 14px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .detail-head .ref{font-size:1.3rem;font-weight:700;color:var(--navy);}
  .detail-head .cust{color:var(--muted);font-size:.9rem;}
  .detail-progress{width:180px;}

  .stage-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px;}
  .stage-pill{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;}
  .stage-pill:hover{border-color:var(--navy);}
  .stage-pill.active{border-color:var(--navy);background:#eef3fa;box-shadow:0 0 0 2px rgba(13,43,82,.12);}
  .stage-pill .num{width:22px;height:22px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}
  .stage-pill .name{font-size:.76rem;line-height:1.2;font-weight:600;}
  .stage-pill .status{font-size:.68rem;color:var(--muted);margin-top:1px;}
  .stage-pill.done .status{color:var(--green);}

  .page-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .page-card h2{margin:0 0 2px;color:var(--navy);font-size:1.15rem;}
  .page-card .page-sub{font-size:.8rem;color:var(--muted);margin-bottom:20px;}
  .section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:22px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .section-title:first-of-type{margin-top:0;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field-grid.single{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:.76rem;color:var(--muted);font-weight:600;}
  .field input, .field select, .field textarea{padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-size:.88rem;font-family:inherit;}
  .field textarea{resize:vertical;min-height:70px;}

  .items-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:.84rem;}
  .items-table th{background:#f1f4f8;padding:7px 8px;text-align:left;font-size:.72rem;color:var(--muted);}
  .items-table td{padding:4px;}
  .items-table input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:5px;font-size:.84rem;}
  .items-table .rm{color:#c0392b;background:none;border:none;cursor:pointer;font-size:1rem;}
  .add-item-btn{background:#eef2f7;border:1px dashed var(--border);color:var(--navy);padding:7px 14px;border-radius:6px;font-size:.8rem;cursor:pointer;margin-bottom:6px;}

  .page-actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--border);}
  .page-actions .save-group{display:flex;gap:10px;}
  .page-actions button{padding:10px 20px;border-radius:8px;font-size:.86rem;cursor:pointer;font-weight:600;border:none;}
  .btn-save{background:#eef1f5;color:var(--text);}
  .btn-print{background:var(--green);color:#fff;}
  .btn-nextstage{background:var(--navy);color:#fff;}

  .status-msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;max-width:80vw;text-align:center;}
  .status-msg.show{opacity:1;}
  .status-msg.error{background:#c0392b;}
</style>
</head>
<body>

<header>
  <h1>Export Document Workflow</h1>
  <div class="sub" id="headerSub">Fill each stage's form to generate its document</div>
</header>

<div class="wrap" id="app"></div>

<div id="statusMsg" class="status-msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
// Storage (Firebase Storage) intentionally not used — that requires the Blaze billing plan.
// File uploads (Loading Sheet, B/L Copy, CO Copy) are instead stored directly inside the
// shipment's Firestore document, capped small enough to fit Firestore's 1 MB per-document limit.

// ---- Firebase config: replace with your project's config ----
// (GitHub's secret scanner may flag this key - it's a public client config, safe to dismiss)
const firebaseConfig = {
  apiKey: "AIzaSyDvbck1_RQCMsQ_SSbhE0Ml_QH0oObxsbU",
  authDomain: "project-dfe9d48e-1faf-4236-b5c.firebaseapp.com",
  projectId: "project-dfe9d48e-1faf-4236-b5c",
  storageBucket: "project-dfe9d48e-1faf-4236-b5c.firebasestorage.app",
  messagingSenderId: "682886232449",
  appId: "1:682886232449:web:6dbce5542312399cecd080"
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
let authReady = false;
let authUser = null; // Firebase Auth user object once signed in, else null (shows login screen)
/* =========================================================================
   STORAGE LAYER
   Currently: browser localStorage, so you can build/test without Firebase.
   Later: swap this block for Firestore calls — the shipment object shape
   (ref, customer, header, items, stages, documents, createdAt) stays the
   same, so the rest of the app (rendering, forms, printing) doesn't change.
   Just replace localAdd/localUpdate/localDelete/localList + the render
   subscription at the bottom with addDoc/updateDoc/deleteDoc/onSnapshot,
   same as the earlier Firebase version of this file.
   ========================================================================= */
// ================= FIRESTORE COLLECTIONS =================
const SHIP_COL = "exportShipments";
const PROVIDER_COL = "expenseProviders";
const TXN_COL = "expenseTxns";
const CONSIGNEE_COL = "consignees";
const CTXN_COL = "consigneeTxns";
const CATALOG_COL = "itemCatalog";
const SETTINGS_DOC_ID = "main";

const PROVIDER_TYPES = ["Clearing Agent", "Freight Forwarder / Shipping Line", "Trucking / Transport", "Port / Terminal", "Bank Charges", "Other"];

// In-memory caches, kept live by the onSnapshot listeners set up at the bottom of this script.
// Every render reads from these directly and synchronously — writes go straight to Firestore,
// and the matching listener fires (near-instantly, via Firestore's local cache) to refresh them,
// which then re-renders. This keeps every existing render/calculation function unchanged.
let txnsCache = [];
let consigneeTxnsCache = [];
let catalogCache = [];
let settingsCache = {};

// ---- Shipments ----
async function localAdd(data){
  const docRef = await addDoc(collection(db, SHIP_COL), { ...data, createdAt: serverTimestamp() });
  return docRef.id;
}
async function localUpdate(id, updates){
  // Firestore natively supports "documents.s1" / "stages.s1" dot-path keys as partial merges,
  // exactly matching how this app already builds its update objects.
  await updateDoc(doc(db, SHIP_COL, id), updates);
}
async function localDelete(id){
  await deleteDoc(doc(db, SHIP_COL, id));
}

// ---- Service providers + expense ledger ----
async function addProviderRecord(data){
  const docRef = await addDoc(collection(db, PROVIDER_COL), { ...data, createdAt: serverTimestamp() });
  return docRef.id;
}
async function deleteProviderRecord(id){ await deleteDoc(doc(db, PROVIDER_COL, id)); }

function listTxns(){ return txnsCache; }
async function addTxnRecord(data){
  const docRef = await addDoc(collection(db, TXN_COL), { ...data, createdAt: serverTimestamp() });
  return docRef.id;
}
async function deleteTxnRecord(id){ await deleteDoc(doc(db, TXN_COL, id)); }
function txnsForProvider(providerId){
  return listTxns().filter(t => t.providerId === providerId).sort((a,b) => new Date(a.date) - new Date(b.date));
}
function providerBalance(providerId){
  return txnsForProvider(providerId).reduce((bal,t) => bal + (t.type==="charge" ? Number(t.amount||0) : -Number(t.amount||0)), 0);
}

// ---- Consignees (buyers) receivable ledger ----
async function addConsigneeRecord(data){
  const docRef = await addDoc(collection(db, CONSIGNEE_COL), { ...data, createdAt: serverTimestamp() });
  return docRef.id;
}
async function deleteConsigneeRecord(id){ await deleteDoc(doc(db, CONSIGNEE_COL, id)); }

function listConsigneeTxns(){ return consigneeTxnsCache; }
async function addConsigneeTxnRecord(data){
  const docRef = await addDoc(collection(db, CTXN_COL), { ...data, createdAt: serverTimestamp() });
  return docRef.id;
}
async function deleteConsigneeTxnRecord(id){ await deleteDoc(doc(db, CTXN_COL, id)); }

// ---- Reusable settings (exporter addresses per entity, bank details) — one shared document ----
function getSettings(){ return settingsCache || {}; }
async function saveSettings(obj){
  await setDoc(doc(db, "appSettings", SETTINGS_DOC_ID), obj);
}
function rememberReusables(headerData, extraData){
  const st = getSettings();
  st.exporterAddresses = st.exporterAddresses || {};
  st.bank = st.bank || {};
  st.lastHeader = st.lastHeader || {};
  if(headerData.exporterEntity && headerData.exporterAddress){
    st.exporterAddresses[headerData.exporterEntity] = headerData.exporterAddress;
  }
  if(extraData.issuerEntity && extraData.issuerAddress){
    st.exporterAddresses[extraData.issuerEntity] = extraData.issuerAddress;
  }
  // remember last-used values for fields that repeat across shipments (final destination intentionally NOT remembered)
  ["portOfDischarge","paymentTerms","currency","incoterm","portOfLoading"].forEach(k => {
    if(headerData[k]) st.lastHeader[k] = headerData[k];
  });
  // bank details belong to whichever entity issued THIS document — Saif Al Sahra for s10/s11, otherwise the shipment's shipper
  const bankEntity = extraData.issuerEntity || headerData.exporterEntity;
  ["bankBeneficiary","bankName","accountNo","swiftCode","bankAddress","branchCode"].forEach(k => {
    if(extraData[k]){
      st.bank[k] = extraData[k];
      if(bankEntity){
        st.bankByEntity = st.bankByEntity || {};
        st.bankByEntity[bankEntity] = st.bankByEntity[bankEntity] || {};
        st.bankByEntity[bankEntity][k] = extraData[k];
      }
    }
  });
  saveSettings(st); // fire-and-forget; settingsCache updates via onSnapshot moments later
  // save buyer address back onto the consignee record so it's known next time
  const s = shipments.find(x => x.id === currentShipId);
  if(s && headerData.buyerAddress){
    const cons = consignees.find(c => c.id === s.consigneeId)
      || consignees.find(c => c.name.toLowerCase() === (s.customer||"").toLowerCase());
    if(cons && !cons.address){
      updateDoc(doc(db, CONSIGNEE_COL, cons.id), { address: headerData.buyerAddress });
    }
  }
}

// ---- Item catalog: product master list, auto-learned from packing lists & invoices ----
function listCatalog(){ return catalogCache; }
async function upsertCatalogItem(data){
  if(!data.description) return;
  const existing = catalogCache.find(c => c.description.toLowerCase() === data.description.toLowerCase());
  if(existing){
    const updates = {};
    ["hsCode","uom","unitPacked","lengthIn","widthIn","heightIn","netWeightPerCtn","grossWeightPerCtn","unitPrice"].forEach(k => {
      if(data[k]) updates[k] = data[k];
    });
    if(Object.keys(updates).length) await updateDoc(doc(db, CATALOG_COL, existing.id), updates);
  } else {
    await addDoc(collection(db, CATALOG_COL), {
      description: data.description,
      hsCode: data.hsCode || "96039000",
      uom: data.uom || "Pcs",
      unitPacked: data.unitPacked || "",
      lengthIn: data.lengthIn || "",
      widthIn: data.widthIn || "",
      heightIn: data.heightIn || "",
      netWeightPerCtn: data.netWeightPerCtn || "",
      grossWeightPerCtn: data.grossWeightPerCtn || "",
      unitPrice: data.unitPrice || "",
      createdAt: serverTimestamp()
    });
  }
}
async function deleteCatalogItem(id){ await deleteDoc(doc(db, CATALOG_COL, id)); }
function findCatalogItem(description){
  return listCatalog().find(c => c.description.toLowerCase() === String(description||"").toLowerCase());
}
function txnsForConsignee(consigneeId){
  return listConsigneeTxns().filter(t => t.consigneeId === consigneeId).sort((a,b) => new Date(a.date) - new Date(b.date));
}
// For consignees: 'invoice' = we billed them (increases what they owe us), 'receipt' = they paid us (decreases it)
function consigneeBalance(consigneeId){
  return txnsForConsignee(consigneeId).reduce((bal,t) => bal + (t.type==="invoice" ? Number(t.amount||0) : -Number(t.amount||0)), 0);
}
// Currency-aware display helpers (transactions can be PKR, USD, AED...)
function sumByCurrency(txns, type){
  const map = {};
  txns.filter(t => t.type === type).forEach(t => {
    const cur = t.currency || "PKR";
    map[cur] = (map[cur]||0) + Number(t.amount||0);
  });
  const parts = Object.entries(map).map(([cur,amt]) => cur + " " + amt.toLocaleString());
  return parts.length ? parts.join(" · ") : "0";
}
function balanceByCurrency(txns){
  const map = {};
  txns.forEach(t => {
    const cur = t.currency || "PKR";
    map[cur] = (map[cur]||0) + (t.type==="invoice"||t.type==="charge" ? Number(t.amount||0) : -Number(t.amount||0));
  });
  const parts = Object.entries(map).filter(([,amt]) => amt !== 0).map(([cur,amt]) => cur + " " + amt.toLocaleString());
  return parts.length ? parts.join(" · ") : "Settled";
}
function whatsappReminder(consigneeId){
  const c = consignees.find(x => x.id === consigneeId);
  if(!c) return;
  let phone = String(c.contact||"").replace(/[^\d+]/g,"");
  if(!phone){
    phone = prompt("Enter WhatsApp number with country code (e.g. 9715xxxxxxxx):") || "";
    phone = phone.replace(/[^\d+]/g,"");
    if(!phone) return;
  }
  phone = phone.replace(/^\+/,"");
  const bal = balanceByCurrency(txnsForConsignee(consigneeId));
  const msg = `Assalam o Alaikum ${c.name},\n\nThis is a payment reminder from Royal Plastics & Household.\nOutstanding balance: ${bal}\n\nPlease arrange payment at your earliest convenience. JazakAllah.`;
  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), "_blank");
}

const EXPORTERS = ["Royal Plastics & Household", "Babji Traders", "Babji Manufacturing"];
const SAIF_ENTITY = "Saif Al Sahra Trading LLC";
const SETTINGS_ENTITIES = [...EXPORTERS, SAIF_ENTITY]; // shown in Data tab so Saif Al Sahra also gets its own address+bank block

const HEADER_FIELDS = [
  { name:"exporterEntity", label:"Shipper", type:"select", options:SETTINGS_ENTITIES, default:EXPORTERS[0] },
  { name:"exporterAddress", label:"Shipper Address", type:"text" },
  { name:"buyerAddress", label:"Buyer Address", type:"text" },
  { name:"consignee", label:"Consignee", type:"text" },
  { name:"portOfLoading", label:"Port of Loading", type:"text", default:"Karachi, Pakistan" },
  { name:"portOfDischarge", label:"Port of Discharge", type:"text" },
  { name:"finalDestination", label:"Final Destination", type:"text" },
  { name:"currency", label:"Currency", type:"text", default:"USD" },
  { name:"incoterm", label:"Incoterm", type:"select", options:["FOB","CIF","CNF","EXW","FCA"], default:"FOB" },
  { name:"paymentTerms", label:"Payment Terms", type:"text" },
];

// Matches the shipper bank details block used on real printed documents
const BANK_FIELDS = [
  {name:"bankBeneficiary", label:"Account Title", type:"text"},
  {name:"swiftCode", label:"Swift Code", type:"text"},
  {name:"bankName", label:"Bank Name", type:"text"},
  {name:"bankAddress", label:"Bank Address", type:"text"},
  {name:"accountNo", label:"IBAN #", type:"text"},
  {name:"branchCode", label:"Branch Code", type:"text"},
];

const STAGES = [
  { key:"s1", num:1, label:"Proforma Invoice", short:"Proforma Invoice", color:"var(--navy)", hasItems:true,
    extraFields:[
      {name:"invoiceNo",label:"Ref Number",type:"text"},
      {name:"invoiceDate",label:"Invoice Date",type:"date"},
      ...BANK_FIELDS,
    ]},
  { key:"s2", num:2, label:"Loading Sheet", short:"Loading Sheet", color:"var(--green)", hasItems:false, fileUpload:true,
    extraFields:[]},
  { key:"s3", num:3, label:"Packing List", short:"Packing List", color:"var(--green)", hasItems:false, packingItems:true,
    extraFields:[
      {name:"packingStatus",label:"Status",type:"select",options:["Final","Draft / Provisional — not yet finalized"],default:"Final"},
      {name:"packingDate",label:"Packing Date",type:"date"},
      {name:"containerNo",label:"Container Number",type:"text"},
      {name:"containerType",label:"Container Type",type:"select",options:["1 X 20 FT CONTAINER","1 X 20 HQ CONTAINER","1 X 40 FT CONTAINER","1 X 40 HQ CONTAINER","LCL"]},
    ]},
  { key:"s4", num:4, label:"Commercial Invoice (Customer)", short:"Comm. Invoice (Customer)", color:"var(--amber)", optional:true, hasItems:true,
    extraFields:[
      {name:"invoiceNo",label:"Invoice No",type:"text"},
      {name:"invoiceDate",label:"Invoice Date",type:"date"},
      ...BANK_FIELDS,

function toast(msg, isError){
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), isError ? 4000 : 2000);
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" });
}
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function emptyStages(){
  const obj = {};
  STAGES.forEach(s => obj[s.key] = { done:false, completedAt:null });
  return obj;
}
// UAE shipments route via Saif Al Sahra: their proforma (s10) comes FIRST, then all other documents, tax invoice last.
// Direct exports to other countries skip the Saif Al Sahra invoices (s10, s11) => 9 stages.
function stagesForShipment(s){
  if(s && s.routing === "direct"){
    return STAGES.filter(st => st.key !== "s10" && st.key !== "s11");
  }
  const s10 = STAGES.find(st => st.key === "s10");
  return [s10, ...STAGES.filter(st => st.key !== "s10")];
}
// Sequential invoice numbers, shared across the whole app. Starting number adjustable in Company Settings.
function incrementTrailingNumber(str){
  const m = String(str||"").match(/^(.*?)(\d+)(\s*)$/);
  if(!m) return str; // no trailing digits found — can't auto-increment, return unchanged
  const nextNum = String(Number(m[2]) + 1).padStart(m[2].length, "0");
  return m[1] + nextNum + m[3];
}
function nextInvoiceNo(){
  const st = getSettings();
  const current = st.invoiceNext || (st.invoiceCounter ? String(st.invoiceCounter) : "1");
  st.invoiceNext = incrementTrailingNumber(current);
  saveSettings(st);
  return current;
}
// Preview the number that WOULD be assigned next, without consuming it — used to show a
// suggestion on real invoice documents before they're actually saved.
function peekNextInvoiceNo(){
  const st = getSettings();
  return st.invoiceNext || (st.invoiceCounter ? String(st.invoiceCounter) : "1");
}
// Stages whose invoice number matters for accounting/tax records — the sequential counter is
// only ever consumed here, and only the first time each such document is actually saved.
// Proforma documents (s1, s10) are quotations, not real invoices, so they never draw from it.
const REAL_INVOICE_STAGES = ["s4","s5","s6","s11"];
function emptyItem(){ return { description:"", hsCode:"", qty:"", unit:"", unitPrice:"" }; }
function emptyPackingItem(){ return { hsCode:"96039000", description:"", uom:"Pcs", unitPacked:"", packingType:"Carton", totalPacked:"", qty:"", totalCBM:"", lengthIn:"", widthIn:"", heightIn:"", netWeightPerCtn:"", grossWeightPerCtn:"" }; }
// Build packing list rows from the invoice items + catalog knowledge, so nothing is typed twice
function derivePackingFromItems(s){
  const src = (s.items || []).filter(it => (it.description||"").trim());
  if(src.length === 0) return [emptyPackingItem()];
  return src.map(it => {
    const cat = findCatalogItem(it.description) || {};
    const unitPacked = cat.unitPacked || "";
    const qty = parseFloat(it.qty) || 0;
    const perCtn = parseFloat(unitPacked) || 0;
    // Cartons round UP (can't ship a fraction of a carton) — but the actual quantity shipped
    // stays exactly what was invoiced, not cartons × per-carton (which would overstate it,
    // since the last carton of an uneven order is only partially full).
    const totalPacked = (qty && perCtn) ? String(Math.ceil(qty / perCtn)) : "";
    return {
      hsCode: it.hsCode || cat.hsCode || "96039000",
      description: it.description,
      uom: it.unit || cat.uom || "Pcs",
      unitPacked,
      packingType: "Carton",
      totalPacked,
      qty: it.qty || "",
      lengthIn: cat.lengthIn || "",
      widthIn: cat.widthIn || "",
      heightIn: cat.heightIn || "",
      netWeightPerCtn: cat.netWeightPerCtn || "",
      grossWeightPerCtn: cat.grossWeightPerCtn || ""
    };
  });
}

function addShipment(){
  const refEl = document.getElementById("newRef");
  const custEl = document.getElementById("newCustomer");
  const routingEl = document.getElementById("newRouting");
  const ref = refEl.value.trim();
  const customer = custEl.value.trim();
  if(!ref){ toast("Enter a shipment reference", true); return; }
  if(customer.toLowerCase().includes("saif al sahr")){
    if(!confirm('Customer is set to Saif Al Sahra — but that\'s the UAE redistributor, not the paying buyer. Enter the real end customer instead?\n\nClick Cancel to fix it, or OK to continue anyway.')) return;
  }
  try{
    const header = {};
    HEADER_FIELDS.forEach(f => header[f.name] = f.default || "");
    const settings = getSettings();
    // pre-fill exporter address from settings (last used for that entity)
    if(settings.exporterAddresses && settings.exporterAddresses[header.exporterEntity]){
      header.exporterAddress = settings.exporterAddresses[header.exporterEntity];
    }
    // pre-fill repeat fields from last shipment (final destination intentionally left blank)
    const lastHeader = settings.lastHeader || {};
    ["portOfDischarge","paymentTerms","currency","incoterm","portOfLoading"].forEach(k => {
      if(!header[k] && lastHeader[k]) header[k] = lastHeader[k];
    });
    // pre-fill buyer address from the consignee record
    const matchedConsignee = consignees.find(c => c.name.toLowerCase() === customer.toLowerCase());
    if(matchedConsignee && matchedConsignee.address){
      header.buyerAddress = matchedConsignee.address;
    }
    if(routingEl.value === "uae"){
      header.finalDestination = header.finalDestination || "UAE";
      header.consignee = header.consignee || header.exporterEntity; // UAE: shipper is consignee ("to order"); buyer is Saif Al Sahra
      header.portOfDischarge = header.portOfDischarge || "Jebel Ali, UAE";
    } else {
      header.consignee = header.consignee || customer;
    }
    localAdd({
      ref, customer, header,
      routing: routingEl.value,
      consigneeId: matchedConsignee ? matchedConsignee.id : null,
      items: [emptyItem()],
      stages: emptyStages(),
      documents: {}
    });
    refEl.value = ""; custEl.value = "";
    toast("Shipment added");
    refreshFromStorage();
  }catch(err){
    console.error(err);
    toast("Error adding shipment: " + err.message, true);
  }
}

  localDelete(shipId);
  toast("Shipment deleted");

// Suggest the next reference by incrementing the trailing number of the most recent ref
function nextRefSuggestion(){
  if(shipments.length === 0) return "";
  const suggestion = incrementTrailingNumber(shipments[0].ref || "");
  return suggestion === (shipments[0].ref || "") ? "" : suggestion;
}

function duplicateShipment(shipId){
  const src = shipments.find(x => x.id === shipId);
  if(!src) return;
  const suggested = nextRefSuggestion() || (src.ref + "-COPY");
  const newRef = prompt("New shipment reference:", suggested);
  if(!newRef || !newRef.trim()) return;
  localAdd({
    ref: newRef.trim(),
    customer: src.customer || "",
    header: { ...(src.header || {}) },
    routing: src.routing || "uae",
    consigneeId: src.consigneeId || null,
    items: (src.items || [emptyItem()]).map(it => ({...it})),
    packingItems: (src.packingItems || []).map(it => ({...it})),
    stages: emptyStages(),
    documents: {}
  });
  toast("Shipment duplicated — documents reset, items & details copied");
  refreshFromStorage();
}

function openShipment(shipId){
  currentShipId = shipId;
  const s = shipments.find(x => x.id === shipId);
  const applicable = stagesForShipment(s);
  const stages = s?.stages || emptyStages();
  const firstIncomplete = applicable.find(st => !stages[st.key]?.done);
  currentStageKey = firstIncomplete ? firstIncomplete.key : applicable[0].key;
  quickFormOpen = null;
  view = "detail";
  renderApp();
}
function backToList(){ view = "list"; currentShipId = null; quickFormOpen = null; renderApp(); }

function editShipmentCustomer(shipId){
  const s = shipments.find(x => x.id === shipId);
  if(!s) return;
  const newName = prompt("Customer (real end buyer) name:", s.customer || "");
  if(newName === null) return;
  const trimmed = newName.trim();
  const matched = consignees.find(c => c.name.toLowerCase() === trimmed.toLowerCase());
  localUpdate(shipId, { customer: trimmed, consigneeId: matched ? matched.id : null });

  refreshFromStorage();
}

function importFileSelected(inputEl){
  const target = document.getElementById("importTarget").value;
  if(!target){ toast("Select what you're importing first (Step 1)", true); inputEl.value=""; return; }
  const partyEl = document.getElementById("importParty");
  const partyId = (target === "catalog") ? null : (partyEl && partyEl.value);
  if(target !== "catalog" && !partyId){ toast("Select the party whose ledger this is", true); inputEl.value=""; return; }
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, { type:"array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:"" });
      if(aoa.length < 2){ toast("File has no data rows", true); return; }
      importState = { headers: aoa[0].map(h => String(h)), rows: aoa.slice(1).filter(r => r.some(c => String(c).trim() !== "")), target, partyId };
      renderApp();
      toast("File read — match the columns in Step 3");
    }catch(err){
      console.error(err);
      toast("Could not read file: " + err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
}

function importParseAmount(v){
  const n = parseFloat(String(v).replace(/,/g,"").replace(/[^\d.\-]/g,""));
  return isNaN(n) ? 0 : n;
}
function importParseDate(v){
  const s = String(v).trim();
  if(!s) return "";
  const d = new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return s; // keep original text if unparseable
}

function runImport(){
  if(!importState || !importState.rows){ toast("Upload a file first", true); return; }
  const col = id => {
    const el = document.getElementById(id);
    return el && el.value !== "" ? parseInt(el.value,10) : null;
  };
  let count = 0;
  try{
    if(importState.target === "catalog"){
      const cDesc = col("mapDesc");
      if(cDesc === null){ toast("Description column is required", true); return; }
      importState.rows.forEach(r => {
        const description = String(r[cDesc]||"").trim();
        if(!description) return;
        upsertCatalogItem({
          description,
          hsCode: col("mapHs")!==null ? String(r[col("mapHs")]||"").trim() : "",
          uom: col("mapUom")!==null ? String(r[col("mapUom")]||"").trim() : "",
          unitPacked: col("mapUnitPacked")!==null ? String(r[col("mapUnitPacked")]||"").trim() : "",
          lengthIn: col("mapLength")!==null ? String(r[col("mapLength")]||"").trim() : "",
          widthIn: col("mapWidth")!==null ? String(r[col("mapWidth")]||"").trim() : "",
          heightIn: col("mapHeight")!==null ? String(r[col("mapHeight")]||"").trim() : "",
          netWeightPerCtn: col("mapNetWt")!==null ? String(r[col("mapNetWt")]||"").trim() : "",
          grossWeightPerCtn: col("mapGrossWt")!==null ? String(r[col("mapGrossWt")]||"").trim() : "",
          unitPrice: col("mapPrice")!==null ? String(r[col("mapPrice")]||"").trim() : ""
        });
        count++;
      });
    } else {
      const cDate = col("mapDate"), cDesc = col("mapDesc"), cShip = col("mapShip"), cDebit = col("mapDebit"), cCredit = col("mapCredit");
      const currency = document.getElementById("mapCurrency").value;
      if(cDebit === null && cCredit === null){ toast("Map at least the debit or credit column", true); return; }
      const isConsignee = importState.target === "consignee";
      importState.rows.forEach(r => {
        const date = cDate !== null ? importParseDate(r[cDate]) : "";
        const description = cDesc !== null ? String(r[cDesc]||"").trim() : "Imported";
        const shipmentRef = cShip !== null ? String(r[cShip]||"").trim() : "";
        const debit = cDebit !== null ? importParseAmount(r[cDebit]) : 0;
        const credit = cCredit !== null ? importParseAmount(r[cCredit]) : 0;
        if(debit > 0){
          if(isConsignee) addConsigneeTxnRecord({ consigneeId: importState.partyId, type:"invoice", date, amount:debit, currency, shipmentRef, description, imported:true });
          else addTxnRecord({ providerId: importState.partyId, type:"charge", date, amount:debit, shipmentRef, description, imported:true });
          count++;
        }
        if(credit > 0){
          if(isConsignee) addConsigneeTxnRecord({ consigneeId: importState.partyId, type:"receipt", date, amount:credit, currency, shipmentRef, description, imported:true });
          else addTxnRecord({ providerId: importState.partyId, type:"payment", date, amount:credit, shipmentRef, description, imported:true });
          count++;
        }
      });
    }
    importState = null;
    refreshFromStorage();
    view = "data";
    renderApp();
    toast(`Imported ${count} records`);
  }catch(err){
    console.error(err);
    toast("Import error: " + err.message, true);
  }
}

// ---------- Backup / Restore ----------
function downloadBackup(){
  const backup = {
    app: "ExportDocWorkflow", exportedAt: new Date().toISOString(),
    data: {
      shipments, providers, txns: txnsCache, consignees, consigneeTxns: consigneeTxnsCache,
      catalog: catalogCache, settings: settingsCache
    }
  };
  const blob = new Blob([JSON.stringify(backup)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ExportDocWorkflow_backup_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Backup downloaded");
}
async function restoreBackup(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!confirm("Restoring will REPLACE all current cloud data with the backup, for everyone using this app. Larger backups can take a minute. Continue?")){ inputEl.value=""; return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup.data){ toast("Not a valid backup file", true); return; }
      toast("Restoring — please wait...");
      const keyToCollection = { shipments: SHIP_COL, providers: PROVIDER_COL, txns: TXN_COL, consignees: CONSIGNEE_COL, consigneeTxns: CTXN_COL, catalog: CATALOG_COL };
      for(const [dataKey, col] of Object.entries(keyToCollection)){
        const records = backup.data[dataKey];
        if(!Array.isArray(records)) continue;
        // wipe everything currently in this collection first
        const existingSnap = await getDocs(collection(db, col));
        let batch = writeBatch(db), opCount = 0;
        for(const d of existingSnap.docs){
          batch.delete(d.ref);
          if(++opCount >= 450){ await batch.commit(); batch = writeBatch(db); opCount = 0; }
        }
        if(opCount > 0) await batch.commit();
        // re-create from the backup, keeping original IDs so cross-references (providerId, consigneeId, shipmentRef) stay intact
        batch = writeBatch(db); opCount = 0;
        for(const rec of records){
          const { id, ...fields } = rec;
          const ref = id ? doc(db, col, id) : doc(collection(db, col));
          batch.set(ref, fields);
          if(++opCount >= 450){ await batch.commit(); batch = writeBatch(db); opCount = 0; }
        }
        if(opCount > 0) await batch.commit();
      }
      if(backup.data.settings){
        await setDoc(doc(db, "appSettings", SETTINGS_DOC_ID), backup.data.settings);
      }
      toast("Backup restored");
    }catch(err){
      console.error(err);
      toast("Restore failed: " + err.message, true);
    }
  };
  reader.readAsText(file);
}

function exportLedgerExcel(kind){
  try{
    let aoa = [], name = "ledger";
    if(kind === "provider" && currentProviderId){
      const p = providers.find(x => x.id === currentProviderId);
      name = "Expenses_" + p.name.replace(/\W+/g,"_");
      aoa = [["Date","Description","Shipment","Charge","Payment"]];
      let bal = 0;
      txnsForProvider(p.id).forEach(t => {
        aoa.push([t.date||"", t.description||"", t.shipmentRef||"", t.type==="charge"?Number(t.amount||0):"", t.type==="payment"?Number(t.amount||0):""]);
      });
    } else if(kind === "consignee" && currentConsigneeId){
      const c = consignees.find(x => x.id === currentConsigneeId);
      name = "Receivables_" + c.name.replace(/\W+/g,"_");
      aoa = [["Date","Description","Shipment","Currency","Invoice","Receipt"]];
      txnsForConsignee(c.id).forEach(t => {
        aoa.push([t.date||"", t.description||"", t.shipmentRef||"", t.currency||"PKR", t.type==="invoice"?Number(t.amount||0):"", t.type==="receipt"?Number(t.amount||0):""]);
      });
    } else {
      name = "Master_Ledger";
      aoa = [["Ledger","Date","Party","Shipment","Description","Type","Currency","Amount"]];
      listTxns().forEach(t => {
        const p = providers.find(x => x.id === t.providerId);
        aoa.push(["Expenses", t.date||"", p?p.name:"", t.shipmentRef||"", t.description||"", t.type, "PKR", Number(t.amount||0)]);
      });
      listConsigneeTxns().forEach(t => {
        const c = consignees.find(x => x.id === t.consigneeId);
        aoa.push(["Receivables", t.date||"", c?c.name:"", t.shipmentRef||"", t.description||"", t.type, t.currency||"PKR", Number(t.amount||0)]);
      });
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Ledger");
    XLSX.writeFile(wb, name + ".xlsx");
  }catch(err){
    console.error(err);
    toast("Export error: " + err.message, true);
  }
}

  const doneCount = applicable.filter(st => stages[st.key]?.done).length;
  const pct = Math.round((doneCount / applicable.length) * 100);
  const routeBadge = s.routing === "direct"
    ? `<span style="font-size:.72rem;background:#eef2f7;color:#6b7280;padding:3px 10px;border-radius:10px;vertical-align:middle;margin-left:8px;">Direct Export</span>`

  const navPills = applicable.map((st, idx) => {
    const d = stages[st.key] || {};
    const savedDoc = (s.documents && s.documents[st.key]) || {};
    const isDraftPacking = st.key === "s3" && d.done && savedDoc.packingStatus && savedDoc.packingStatus.startsWith("Draft");
    const statusText = isDraftPacking ? '⚠ Draft' : (d.done ? '✓ Generated' : (st.optional ? 'Optional' : 'Pending'));

  }).join("");

  return `

      <div>
        <div class="ref">${escapeHtml(s.ref)}${routeBadge}</div>

      </div>

        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${doneCount}/${applicable.length} documents generated</div>

function renderShipmentFinancials(s){
  const expenseTxns = listTxns().filter(t => t.shipmentRef === s.ref);
  const consigneeTxns = listConsigneeTxns().filter(t => t.shipmentRef === s.ref);

  const totalCharges = expenseTxns.filter(t=>t.type==="charge").reduce((sum,t)=>sum+Number(t.amount||0),0);
  const totalPaidOut = expenseTxns.filter(t=>t.type==="payment").reduce((sum,t)=>sum+Number(t.amount||0),0);
  const totalInvoiced = consigneeTxns.filter(t=>t.type==="invoice").reduce((sum,t)=>sum+Number(t.amount||0),0);
  const totalReceived = consigneeTxns.filter(t=>t.type==="receipt").reduce((sum,t)=>sum+Number(t.amount||0),0);

  // Invoice value from Commercial Invoice (Bank), falling back to Customer invoice, then Proforma
  const invDoc = (s.documents && (s.documents.s5 || s.documents.s4 || s.documents.s1)) || null;
  const invCurrency = (s.header && s.header.currency) || "USD";
  const invoiceValue = invDoc && invDoc.items
    ? invDoc.items.reduce((sum,it) => sum + (parseFloat(it.qty)||0)*(parseFloat(it.unitPrice)||0), 0) + (parseFloat(invDoc.extraChargeAmount)||0)
    : 0;
  const marginStat = invoiceValue > 0 ? `
      <div class="stat"><div class="label">Invoice Value</div><div class="value">${escapeHtml(invCurrency)} ${invoiceValue.toLocaleString()}</div></div>
      <div class="stat"><div class="label">Margin (invoice − PKR expenses)</div><div class="value">${escapeHtml(invCurrency)} ${invoiceValue.toLocaleString()} − PKR ${totalCharges.toLocaleString()}</div></div>` : "";

  const expenseRows = expenseTxns.map(t => {
    const prov = providers.find(p => p.id === t.providerId);

      <td class="${t.type==='invoice'?'amt-charge':'amt-payment'}">${t.type==='invoice'?'Invoice':'Receipt'}: ${(t.currency||'PKR')} ${Number(t.amount||0).toLocaleString()}</td></tr>`;
  }).join("");

  const providerOptions = providers.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
  const consigneeOptions = consignees.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");

  const expenseForm = quickFormOpen === 'expense' ? `
    <div class="txn-form">
      <h3>Add Expense for ${escapeHtml(s.ref)}</h3>
      ${providers.length===0 ? `<div class="empty">No service providers yet — add one on the Expenses tab first.</div>` : `

        <div class="field"><label>Type</label><select id="qeType"><option value="charge">Charge</option><option value="payment">Payment</option></select></div>
        <div class="field"><label>Date</label><input id="qeDate" type="date"></div>
        <div class="field"><label>Amount (PKR)</label><input id="qeAmount" type="text" inputmode="numeric" pattern="[0-9]*"></div>
        <div class="field" style="grid-column:1/-1"><label>Description</label><input id="qeDesc" type="text" placeholder="e.g. Customs clearance charges"></div>
      </div>
      <div class="page-actions" style="border-top:none;margin-top:12px;padding-top:0;">
        <div></div>
        <div class="save-group">
          <button class="btn-cancel" onclick="App.closeQuickForms()">Cancel</button>
          <button class="btn-nextstage" onclick="App.quickAddExpenseSubmit('${escapeHtml(s.ref)}')">Add</button>
        </div>
      </div>`}
    </div>` : "";

  const consigneeForm = quickFormOpen === 'consignee' ? `
    <div class="txn-form">
      <h3>Add Consignee Entry for ${escapeHtml(s.ref)}</h3>
      ${consignees.length===0 ? `<div class="empty">No consignees yet — add one on the Consignees tab first.</div>` : `
      <div class="field-grid">
        <div class="field"><label>Consignee</label><select id="qcConsignee">${consigneeOptions}</select></div>
        <div class="field"><label>Type</label><select id="qcType"><option value="invoice">Invoice</option><option value="receipt">Receipt</option></select></div>
        <div class="field"><label>Date</label><input id="qcDate" type="date"></div>
        <div class="field"><label>Amount (PKR)</label><input id="qcAmount" type="text" inputmode="numeric" pattern="[0-9]*"></div>
        <div class="field" style="grid-column:1/-1"><label>Description</label><input id="qcDesc" type="text" placeholder="e.g. Commercial invoice, T/T received"></div>
      </div>
      <div class="page-actions" style="border-top:none;margin-top:12px;padding-top:0;">
        <div></div>
        <div class="save-group">
          <button class="btn-cancel" onclick="App.closeQuickForms()">Cancel</button>
          <button class="btn-nextstage" onclick="App.quickAddConsigneeSubmit('${escapeHtml(s.ref)}')">Add</button>
        </div>
      </div>`}
    </div>` : "";

  return `
    <div class="section-title">Shipment Financials</div>
    <div class="ledger-summary">
      <div class="stat"><div class="label">Expenses Charged</div><div class="value">PKR ${totalCharges.toLocaleString()}</div></div>
      <div class="stat"><div class="label">Expenses Paid</div><div class="value">PKR ${totalPaidOut.toLocaleString()}</div></div>
      <div class="stat"><div class="label">Invoiced to Consignee</div><div class="value">PKR ${totalInvoiced.toLocaleString()}</div></div>
      <div class="stat"><div class="label">Received from Consignee</div><div class="value">PKR ${totalReceived.toLocaleString()}</div></div>

    ${(expenseTxns.length || consigneeTxns.length) ? `
    <table class="ledger-table" style="margin-bottom:14px;">
      <thead><tr><th>Date</th><th>Party</th><th>Description</th><th>Amount</th></tr></thead>

    <div style="display:flex;gap:10px;margin-bottom:6px;">
      <button class="btn-nextstage" onclick="App.openQuickExpenseForm()">+ Add Expense</button>

function smartDefault(f, s, header, stage){
  const settings = getSettings();
  if(f.name === "invoiceNo"){
    if(!(stage && REAL_INVOICE_STAGES.includes(stage.key))) return s.ref; // Proforma docs: free, never wasted
    return s.invoiceNo || peekNextInvoiceNo(); // real invoice: reuse the shipment's number once drawn, else preview it
  }
  if(f.name === "certNo" || f.name === "contractNo" || f.name === "blNo") return s.ref;
  if(["packingDate","certDate","blDate","contractDate"].includes(f.name)) return new Date().toISOString().slice(0,10);
  if(f.name === "issuerAddress") return (settings.exporterAddresses||{})[SAIF_ENTITY] || "";
  if(f.name === "buyerOverride") return s.customer || "";
  if(["bankBeneficiary","bankName","accountNo","swiftCode","bankAddress","branchCode"].includes(f.name)){
    // Saif Al Sahra documents (s10/s11) use Saif Al Sahra's own bank; other stages use the shipment's shipper entity
    const isSaifDoc = stage && stage.extraFields.some(x => x.name === "issuerEntity");
    const entity = isSaifDoc ? SAIF_ENTITY : header.exporterEntity;
    const perEntity = (settings.bankByEntity||{})[entity] || {};
    return perEntity[f.name] || (settings.bank||{})[f.name] || "";
  }
  if(f.name === "shipperName") return header.exporterEntity || "";
  return f.default || "";
}

function renderStagePage(s, stageKey){
  const stage = STAGES.find(x => x.key === stageKey);
  const header = { ...(s.header || {}) };
  // fill gaps from reusable settings + consignee record + routing (finalDestination intentionally left manual)
  const settings = getSettings();
  const lastHeader = settings.lastHeader || {};
  if(!header.exporterAddress && settings.exporterAddresses && settings.exporterAddresses[header.exporterEntity]){
    header.exporterAddress = settings.exporterAddresses[header.exporterEntity];
  }
  if(!header.buyerAddress){
    const mc = consignees.find(c => c.id === s.consigneeId)
      || consignees.find(c => c.name.toLowerCase() === (s.customer||"").toLowerCase());
    if(mc && mc.address) header.buyerAddress = mc.address;
  }
  if(s.routing !== "direct"){
    // UAE routing: the shipper is the consignee. Also migrates shipments saved under the
    // old default (where "Saif Al Sahra" sat in this slot) — Saif Al Sahra is the buyer now.
    if(!header.consignee || header.consignee === "Saif Al Sahra") header.consignee = header.exporterEntity || "";
  } else if(!header.consignee){
    header.consignee = s.customer || "";
  }
  if(!header.portOfDischarge && s.routing !== "direct"){
    header.portOfDischarge = "Jebel Ali, UAE";
  }
  ["portOfDischarge","paymentTerms","currency","incoterm","portOfLoading"].forEach(k => {
    if(!header[k] && lastHeader[k]) header[k] = lastHeader[k];
  });
  const savedDoc = (s.documents && s.documents[stageKey]) || {};
  modalItemRows = (savedDoc.items && savedDoc.items.length ? savedDoc.items : s.items) || [emptyItem()];
  modalItemRows = modalItemRows.map(it => ({...it}));
  packingItemRows = (savedDoc.packingItems && savedDoc.packingItems.length ? savedDoc.packingItems : (s.packingItems && s.packingItems.length ? s.packingItems : derivePackingFromItems(s)));
  packingItemRows = packingItemRows.map(it => ({...it}));
  // Per-row override flags: if a saved doc predates these flags, infer them — a stored Qty or
  // Total CBM that differs from the computed default was a manual override, so keep respecting it.
  packingItemRows.forEach(it => {
    const tp = parseFloat(it.totalPacked)||0;
    const L = parseFloat(it.lengthIn)||0, W = parseFloat(it.widthIn)||0, H = parseFloat(it.heightIn)||0;
    const cbmPerCtn = (L*W*H) * 0.000016387064;
    if(it._cbmTouched === undefined){
      const autoCbm = (cbmPerCtn*tp) ? (cbmPerCtn*tp).toFixed(2) : "";
      it._cbmTouched = (it.totalCBM !== undefined && it.totalCBM !== "" && String(it.totalCBM) !== autoCbm);
    }
    if(it._qtyTouched === undefined){
      const autoQty = ((parseFloat(it.unitPacked)||0) * tp) || "";
      it._qtyTouched = (it.qty !== undefined && it.qty !== "" && String(it.qty) !== String(autoQty));
    }
  });
  customFieldRows = (savedDoc.customFields || []).map(f => ({...f}));
  packingCbmOverridden = (savedDoc.totalCBM != null && savedDoc.totalCBM !== "");
  packingCbmSavedOverride = savedDoc.totalCBM;
  pendingUploadFile = null;

  const isSaifDoc = stage.extraFields.some(f => f.name === "issuerEntity");
  // Buyer Address is the END customer's address. It only belongs on the Saif Al Sahra docs
  // (shown next to Buyer Name there). On UAE manufacturer docs the buyer is Saif Al Sahra, so hide it.
  const hideBuyerAddress = isSaifDoc || s.routing !== "direct";
  const headerFieldsHtml = HEADER_FIELDS
    .filter(f => !(isSaifDoc && (f.name === "exporterEntity" || f.name === "exporterAddress")))
    .filter(f => !(hideBuyerAddress && f.name === "buyerAddress"))
    .map(f => `
    <div class="field"><label>${f.label}</label>${fieldInput(f, header[f.name])}</div>`).join("");
  const saifNote = isSaifDoc ? `<div style="font-size:.78rem;color:var(--muted);margin:-4px 0 14px;">This document is issued by Saif Al Sahra — see "Issued By" below. (The manufacturing Shipper above doesn't apply here and isn't shown.)</div>` : "";
  const extraFieldsHtml = stage.extraFields.map(f => {
    const val = savedDoc[f.name] != null && savedDoc[f.name] !== "" ? savedDoc[f.name] : smartDefault(f, s, header, stage);
    let html = `<div class="field"><label>${f.label}</label>${fieldInput(f, val)}</div>`;
    if(isSaifDoc && f.name === "buyerOverride"){
      // Buyer Address sits right next to Buyer Name here (still saved into the shared header, via data-headerfield)
      html += `<div class="field"><label>Buyer Address</label><input type="text" data-headerfield="buyerAddress" value="${escapeHtml(header.buyerAddress||'')}"></div>`;
    }
    return html;
  }).join("");

  let itemsBlock = "";
  if(stage.hasItems){
    itemsBlock = `
    <div class="section-title">Items</div>
    <div id="itemsEditorWrap">${renderItemsEditor()}</div>`;
  } else if(stage.packingItems){
    itemsBlock = `
    <div class="section-title">Packing Items</div>
    <div id="packingEditorWrap">${renderPackingItemsEditor()}</div>`;
  } else if(stage.fileUpload){
    const existing = savedDoc.fileName ? `
      <div style="margin-bottom:10px;font-size:.86rem;">
        📎 Uploaded: <b>${escapeHtml(savedDoc.fileName)}</b>
        <button class="btn-save" style="margin-left:10px;padding:5px 12px;" onclick="App.downloadStageFile('${stageKey}')">Download</button>
      </div>` : `<div style="margin-bottom:10px;font-size:.84rem;color:var(--muted);">No file uploaded yet.</div>`;
    itemsBlock = `
    <div class="section-title">${escapeHtml(stage.label)} File</div>
    ${existing}
    <input type="file" id="stageFileInput" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.csv" onchange="App.stageFileSelected(this)" style="font-size:.85rem;">
    <div style="font-size:.76rem;color:var(--muted);margin-top:6px;">Upload the ${escapeHtml(stage.label.toLowerCase())} (scanned PDF, photo, or Excel/CSV). Keep it under ~200 KB — a low-res photo or a compressed PDF works well; large hi-res scans usually won't fit.</div>`;
  }

  const remarksAndCustomBlock = !stage.fileUpload ? `
      <div class="section-title">Remarks</div>
      <div class="field-grid single" id="remarksSection">
        <div class="field"><textarea data-field="remarks" style="min-height:70px;">${escapeHtml(savedDoc.remarks||'')}</textarea></div>
      </div>

      <div class="section-title">Additional Fields <span style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;">— for anything non-standard, not covered above</span></div>
      <div id="customFieldsWrap">${renderCustomFieldsEditor()}</div>` : "";

  const applicable = stagesForShipment(s);
  const stageIdx = applicable.findIndex(x => x.key === stageKey);
  const nextStage = applicable[stageIdx+1];

  return `
    <div class="page-card">
      <h2>${stageIdx+1}. ${stage.label}</h2>
      <div class="page-sub">${escapeHtml(s.ref)}${s.customer ? ' — ' + escapeHtml(s.customer) : ''}</div>

      <div class="section-title">Shipment Details</div>
      ${saifNote}
      <div class="field-grid" id="headerFields">${headerFieldsHtml}</div>

      ${stage.extraFields.length ? `
      <div class="section-title">${escapeHtml(stage.short)} Details</div>
      <div class="field-grid" id="extraFields">${extraFieldsHtml}</div>` : ""}

      ${itemsBlock}
      ${remarksAndCustomBlock}

      <div class="page-actions">
        <div>${nextStage ? `<button class="btn-nextstage" onclick="App.saveStageData(false,'${nextStage.key}')">Save & Go to Next Document →</button>` : ''}</div>
        <div class="save-group">
          <button class="btn-save" onclick="App.saveStageData(false,null)">Save</button>
          ${stage.fileUpload ? '' : `<button class="btn-print" onclick="App.saveStageData(true,null)">Save & Print</button>`}
        </div>
      </div>
    </div>`;
}

// ---------- field + items helpers ----------
function fieldInput(f, value){
  const val = value != null && value !== "" ? value : (f.default || "");
  if(f.type === "select"){
    const opts = f.options.map(o => `<option value="${escapeHtml(o)}" ${o===val?'selected':''}>${escapeHtml(o)}</option>`).join("");
    const onchange = f.name === "exporterEntity" ? ` onchange="App.shipperChanged(this.value)"` : "";
    return `<select data-field="${f.name}"${onchange}>${opts}</select>`;
  }
  if(f.type === "textarea"){
    return `<textarea data-field="${f.name}">${escapeHtml(val)}</textarea>`;
  }
  return `<input type="${f.type}" data-field="${f.name}" value="${escapeHtml(val)}">`;
}

// When the shipper is switched on a document, reload its address + bank details from settings
function shipperChanged(entity){
  const st = getSettings();
  const addrEl = document.querySelector('#headerFields [data-field="exporterAddress"]');
  if(addrEl) addrEl.value = (st.exporterAddresses||{})[entity] || "";
  const bank = (st.bankByEntity||{})[entity] || st.bank || {};
  ["bankBeneficiary","bankName","accountNo","swiftCode","bankAddress","branchCode"].forEach(k => {
    const el = document.querySelector('#extraFields [data-field="'+k+'"]');
    if(el) el.value = bank[k] || "";
  });
  const shipperEl = document.querySelector('#extraFields [data-field="shipperName"]');
  if(shipperEl) shipperEl.value = entity;
  // On UAE shipments the shipper is the consignee — keep that in step when the shipper changes
  // (only if the field still holds an auto-set company name; a hand-typed value is left alone).
  const ship = shipments.find(x => x.id === currentShipId);
  const consEl = document.querySelector('#headerFields [data-field="consignee"]');
  if(ship && ship.routing !== "direct" && consEl && (!consEl.value || SETTINGS_ENTITIES.includes(consEl.value))){
    consEl.value = entity;
  }
}

function syncItemRowsFromDom(){
  document.querySelectorAll('[data-item]').forEach(el => {
    const idx = parseInt(el.dataset.idx,10);
    const key = el.dataset.item;
    if(modalItemRows[idx]) modalItemRows[idx][key] = el.value;
  });
}
function addItemRow(){
  syncItemRowsFromDom();
  modalItemRows.push(emptyItem());
  document.getElementById("itemsEditorWrap").innerHTML = renderItemsEditor();
}
function removeItemRow(i){
  syncItemRowsFromDom();
  modalItemRows.splice(i,1);
  if(modalItemRows.length===0) modalItemRows.push(emptyItem());
  document.getElementById("itemsEditorWrap").innerHTML = renderItemsEditor();
}

// ---------- Packing list items (Babji Manufacturing format) ----------
function renderPackingItemsEditor(){
  const catalogOptions = listCatalog().map(c => `<option value="${escapeHtml(c.description)}">`).join("");
  const rows = packingItemRows.map((it, i) => {
    const totalPacked = parseFloat(it.totalPacked)||0;
    const L = parseFloat(it.lengthIn)||0, W = parseFloat(it.widthIn)||0, H = parseFloat(it.heightIn)||0;
    const cbmPerCtn = (L*W*H) * 0.000016387064; // cubic inches -> m3 (1 in3 = 16.387064 cm3)
    const netPerCtn = parseFloat(it.netWeightPerCtn)||0, grossPerCtn = parseFloat(it.grossWeightPerCtn)||0;
    const totalNet = netPerCtn * totalPacked;
    const totalGross = grossPerCtn * totalPacked;
    // Qty and Total CBM both default to a computed figure when never explicitly set, but stay
    // fully editable — same pattern, since real-world packing sometimes needs a manual override
    // (a partially-filled last carton, an actual measured volume that differs slightly, etc.).
    const qtyDisplay = (it.qty !== undefined && it.qty !== "") ? it.qty : ((parseFloat(it.unitPacked)||0) * totalPacked || "");
    const cbmDisplay = (it.totalCBM !== undefined && it.totalCBM !== "") ? it.totalCBM : ((cbmPerCtn * totalPacked) ? (cbmPerCtn*totalPacked).toFixed(2) : "");
    return `
    <tr>
      <td><input data-pitem="hsCode" data-idx="${i}" value="${escapeHtml(it.hsCode)}" placeholder="HS Code" style="width:85px;"></td>
      <td><input data-pitem="description" data-idx="${i}" value="${escapeHtml(it.description)}" placeholder="Item description" list="catalogPackingNames" autocomplete="off" onchange="App.packingCatalogFill(${i})" style="min-width:150px;"></td>
      <td><input data-pitem="uom" data-idx="${i}" value="${escapeHtml(it.uom)}" placeholder="UOM" style="width:50px;"></td>
      <td><input data-pitem="unitPacked" data-idx="${i}" value="${escapeHtml(it.unitPacked)}" placeholder="Unit Packed" style="width:75px;" oninput="App.packingRecalc()"></td>
      <td><input data-pitem="packingType" data-idx="${i}" value="${escapeHtml(it.packingType)}" placeholder="Packing" style="width:70px;"></td>
      <td><input data-pitem="totalPacked" data-idx="${i}" value="${escapeHtml(it.totalPacked)}" placeholder="Cartons" style="width:65px;" oninput="App.packingRecalc()"></td>
      <td><input data-pitem="lengthIn" data-idx="${i}" value="${escapeHtml(it.lengthIn)}" placeholder="L in" style="width:60px;" oninput="App.packingRecalc()"></td>
      <td><input data-pitem="widthIn" data-idx="${i}" value="${escapeHtml(it.widthIn)}" placeholder="W in" style="width:60px;" oninput="App.packingRecalc()"></td>
      <td><input data-pitem="heightIn" data-idx="${i}" value="${escapeHtml(it.heightIn)}" placeholder="H in" style="width:60px;" oninput="App.packingRecalc()"></td>
      <td style="font-size:.78rem;text-align:right;white-space:nowrap;" data-calc-cbmctn="${i}">${cbmPerCtn ? cbmPerCtn.toFixed(4) : ''}</td>
      <td><input data-pitem="netWeightPerCtn" data-idx="${i}" value="${escapeHtml(it.netWeightPerCtn)}" placeholder="Net kg" style="width:65px;" oninput="App.packingRecalc()"></td>
      <td><input data-pitem="grossWeightPerCtn" data-idx="${i}" value="${escapeHtml(it.grossWeightPerCtn)}" placeholder="Gross kg" style="width:70px;" oninput="App.packingRecalc()"></td>
      <td><input data-pitem="qty" data-idx="${i}" value="${escapeHtml(qtyDisplay)}" placeholder="Actual qty" style="width:80px;" oninput="App.packingQtyRowEdited(${i})" onblur="App.packingRecalc()" title="Actual quantity shipped — matches the invoice, independent of carton rounding"></td>
      <td><input data-pitem="totalCBM" data-idx="${i}" value="${escapeHtml(cbmDisplay)}" placeholder="Total CBM" style="width:75px;" oninput="App.packingCbmRowEdited(${i})" onblur="App.packingRecalc()" title="Defaults to CBM/Ctn × Cartons — editable if the actual figure differs"></td>
      <td style="font-size:.78rem;text-align:right;white-space:nowrap;" data-calc-net="${i}">${totalNet ? totalNet.toFixed(1) : ''}</td>
      <td style="font-size:.78rem;text-align:right;white-space:nowrap;" data-calc-gross="${i}">${totalGross ? totalGross.toFixed(1) : ''}</td>
      <td><button class="rm" onclick="App.removePackingItemRow(${i})">✕</button></td>
    </tr>`;
  }).join("");

  const totals = packingTotals();

  return `
    <datalist id="catalogPackingNames">${catalogOptions}</datalist>
    <div style="overflow-x:auto;">
    <table class="items-table">
      <thead><tr><th>HS Code</th><th>Item Description</th><th>UOM</th><th>Unit Packed</th><th>Packing Type</th><th>Cartons</th><th>L (in)</th><th>W (in)</th><th>H (in)</th><th>CBM/Ctn</th><th>Net Wt/Ctn (kg)</th><th>Gross Wt/Ctn (kg)</th><th>Total Qty (UOM)</th><th>Total CBM</th><th>Total Net (kg)</th><th>Total Gross (kg)</th><th></th></tr></thead>
      <tbody id="packingTbody">${rows}</tbody>
      <tfoot><tr style="font-weight:700;background:#f1f4f8;">
        <td colspan="5" style="text-align:right;padding:7px 8px;">Totals</td>
        <td style="padding:7px 8px;" id="packingTotalPacked">${totals.packed.toLocaleString()}</td>
        <td colspan="4"></td>
        <td colspan="2"></td>
        <td style="text-align:right;padding:7px 8px;" id="packingTotalUOM">${totals.uom.toLocaleString()}</td>
        <td style="padding:2px 4px;"><input id="packingTotalCBM" value="${escapeHtml(packingCbmOverridden && packingCbmSavedOverride != null ? packingCbmSavedOverride : totals.cbm.toFixed(2))}" oninput="App.markCbmOverride()" style="width:75px;text-align:right;font-weight:700;border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-size:.85rem;" title="Auto-sums from the rows above — edit directly to override the final figure"></td>
        <td style="text-align:right;padding:7px 8px;" id="packingTotalNet">${totals.net.toFixed(1)}</td>
        <td style="text-align:right;padding:7px 8px;" id="packingTotalGross">${totals.gross.toFixed(1)}</td>
        <td></td>
      </tr></tfoot>
    </table>
    </div>
    <button type="button" class="add-item-btn" onclick="App.addPackingItemRow()">+ Add Item</button>
    <button type="button" class="add-item-btn" onclick="App.recalcCartonsFromItems()" style="margin-left:8px;">↻ Recalculate Cartons (Qty ÷ Unit Packed)</button>`;
}
function packingTotals(){
  let packed=0, uom=0, cbm=0, net=0, gross=0;
  packingItemRows.forEach(it => {
    const tp = parseFloat(it.totalPacked)||0;
    const L = parseFloat(it.lengthIn)||0, W = parseFloat(it.widthIn)||0, H = parseFloat(it.heightIn)||0;
    const cbmPerCtn = (L*W*H) * 0.000016387064; // cubic inches -> m3
    const netPerCtn = parseFloat(it.netWeightPerCtn)||0, grossPerCtn = parseFloat(it.grossWeightPerCtn)||0;
    packed += tp;
    uom += parseFloat(it.qty) || ((parseFloat(it.unitPacked)||0) * tp);
    cbm += parseFloat(it.totalCBM) || (cbmPerCtn*tp);
    net += netPerCtn*tp;
    gross += grossPerCtn*tp;
  });
  return { packed, uom, cbm, net, gross };
}
function syncPackingRowsFromDom(){
  document.querySelectorAll('[data-pitem]').forEach(el => {
    const idx = parseInt(el.dataset.idx,10);
    const key = el.dataset.pitem;
    if(packingItemRows[idx]) packingItemRows[idx][key] = el.value;
  });
}
function packingRecalc(){
  syncPackingRowsFromDom();
  packingItemRows.forEach((it, i) => {
    const tp = parseFloat(it.totalPacked)||0;
    const L = parseFloat(it.lengthIn)||0, W = parseFloat(it.widthIn)||0, H = parseFloat(it.heightIn)||0;
    const cbmPerCtn = (L*W*H) * 0.000016387064; // cubic inches -> m3
    const netPerCtn = parseFloat(it.netWeightPerCtn)||0, grossPerCtn = parseFloat(it.grossWeightPerCtn)||0;
    const cbmCtnEl = document.querySelector(`[data-calc-cbmctn="${i}"]`);
    const netEl = document.querySelector(`[data-calc-net="${i}"]`);
    const grossEl = document.querySelector(`[data-calc-gross="${i}"]`);
    if(cbmCtnEl) cbmCtnEl.textContent = cbmPerCtn ? cbmPerCtn.toFixed(4) : '';
    if(netEl) netEl.textContent = (netPerCtn*tp) ? (netPerCtn*tp).toFixed(1) : '';
    if(grossEl) grossEl.textContent = (grossPerCtn*tp) ? (grossPerCtn*tp).toFixed(1) : '';
    // Live-fill the editable Qty and Total CBM defaults too (previously these only filled on a
    // full re-render, leaving them blank when other fields changed). Skip rows the user has
    // hand-edited, and never fight the field the user is currently typing in.
    const cbmInput = document.querySelector(`[data-pitem="totalCBM"][data-idx="${i}"]`);
    if(cbmInput && !it._cbmTouched && cbmInput !== document.activeElement){
      const autoCbm = (cbmPerCtn*tp) ? (cbmPerCtn*tp).toFixed(2) : "";
      cbmInput.value = autoCbm;
      it.totalCBM = autoCbm;
    }
    const qtyInput = document.querySelector(`[data-pitem="qty"][data-idx="${i}"]`);
    if(qtyInput && !it._qtyTouched && qtyInput !== document.activeElement){
      const autoQty = ((parseFloat(it.unitPacked)||0) * tp) || "";
      qtyInput.value = autoQty;
      it.qty = String(autoQty);
    }
  });
  const totals = packingTotals();
  const tp = document.getElementById("packingTotalPacked");
  const tu = document.getElementById("packingTotalUOM");
  const tc = document.getElementById("packingTotalCBM");
  const tn = document.getElementById("packingTotalNet");
  const tg = document.getElementById("packingTotalGross");
  if(tp) tp.textContent = totals.packed.toLocaleString();
  if(tu) tu.textContent = totals.uom.toLocaleString();
  if(tc && !packingCbmOverridden) tc.value = totals.cbm.toFixed(2);
  if(tn) tn.textContent = totals.net.toFixed(1);
  if(tg) tg.textContent = totals.gross.toFixed(1);
}
// User hand-edited the grand-total CBM field — stop auto-overwriting it as rows change,
// until this document is reopened fresh (which resets the flag).
function markCbmOverride(){
  packingCbmOverridden = true;
}
// Per-row versions: typing directly in a row's Total CBM or Qty marks it as a manual override.
// Clearing the field hands it back to auto-calc (refills on blur).
function packingCbmRowEdited(i){
  const it = packingItemRows[i];
  if(it) it._cbmTouched = (document.querySelector(`[data-pitem="totalCBM"][data-idx="${i}"]`)||{}).value !== "";
  packingRecalc();
}
function packingQtyRowEdited(i){
  const it = packingItemRows[i];
  if(it) it._qtyTouched = (document.querySelector(`[data-pitem="qty"][data-idx="${i}"]`)||{}).value !== "";
  packingRecalc();
}
// Recompute each row's Cartons from the invoice quantity ÷ Unit Packed — use this any time
// Unit Packed gets corrected after the packing list was first generated, since Cartons doesn't
// auto-update on its own (it's an editable field, not a live formula).
function recalcCartonsFromItems(){
  syncPackingRowsFromDom();
  const s = shipments.find(x => x.id === currentShipId);
  if(!s){ toast("Open a shipment first", true); return; }
  let changed = 0;
  packingItemRows.forEach(row => {
    const invItem = (s.items||[]).find(it => (it.description||"").trim().toLowerCase() === (row.description||"").trim().toLowerCase());
    const qty = invItem ? parseFloat(invItem.qty)||0 : 0;
    const perCtn = parseFloat(row.unitPacked)||0;
    if(qty && perCtn){
      row.totalPacked = String(Math.ceil(qty / perCtn));
      row.qty = invItem.qty;
      changed++;
    }
  });
  document.getElementById("packingEditorWrap").innerHTML = renderPackingItemsEditor();
  if(changed === 0){
    toast("Couldn't match any rows to invoice items — check item descriptions match, and Unit Packed is filled in.", true);
  } else {
    toast(`Recalculated cartons for ${changed} item${changed===1?'':'s'}`);
  }
}
function addPackingItemRow(){
  syncPackingRowsFromDom();
  packingItemRows.push(emptyPackingItem());
  document.getElementById("packingEditorWrap").innerHTML = renderPackingItemsEditor();
}
function removePackingItemRow(i){
  syncPackingRowsFromDom();
  packingItemRows.splice(i,1);
  if(packingItemRows.length===0) packingItemRows.push(emptyPackingItem());
  document.getElementById("packingEditorWrap").innerHTML = renderPackingItemsEditor();
}

// ---------- Loading sheet file upload ----------
function stageFileSelected(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const MAX_RAW = 200 * 1024; // ~200 KB raw per file — a shipment can hold up to 3 such files
                                // (Loading Sheet, B/L Copy, CO Copy) plus all its other data within
                                // Firestore's 1 MB per-document limit, so each file stays small.
  if(file.size > MAX_RAW){
    toast(`File too large (max ~200 KB). Try a lower-res photo/scan, or compress the PDF — plenty of free tools do this in seconds.`, true);
    inputEl.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingUploadFile = { name: file.name, dataUrl: reader.result };
    toast("File ready — click Save to store it");
  };
  reader.onerror = () => toast("Could not read file", true);
  reader.readAsDataURL(file);
}
function downloadStageFile(stageKey){
  const s = shipments.find(x => x.id === currentShipId);
  const savedDoc = s && s.documents && s.documents[stageKey];
  if(!savedDoc || !savedDoc.fileDataUrl){ toast("No file stored", true); return; }
  const a = document.createElement("a");
  a.href = savedDoc.fileDataUrl;
  a.download = savedDoc.fileName || "uploaded-document";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// ---------- Save ----------
async function saveStageData(shouldPrint, goToStageKey){
  if(!currentShipId) return;
  const s = shipments.find(x => x.id === currentShipId);
  const stage = STAGES.find(x => x.key === currentStageKey);
  if(!s || !stage) return;

  syncItemRowsFromDom();
  if(stage.packingItems) syncPackingRowsFromDom();
  if(!stage.fileUpload) syncCustomFieldsFromDom();

  const headerData = {};
  document.querySelectorAll('#headerFields [data-field]').forEach(el => headerData[el.dataset.field] = el.value);
  // Some pages hide certain shared fields (Shipper on Saif Al Sahra docs, Buyer Address on UAE
  // manufacturer docs). Carry those forward from the saved header so saving here never wipes them.
  HEADER_FIELDS.forEach(f => {
    if(!(f.name in headerData) && s.header && s.header[f.name] != null) headerData[f.name] = s.header[f.name];
  });
  // Fields rendered outside #headerFields (e.g. Buyer Address paired next to Buyer Name) still belong to the shared header
  document.querySelectorAll('[data-headerfield]').forEach(el => headerData[el.dataset.headerfield] = el.value);
  const extraData = {};
  if(document.getElementById("extraFields")){
    document.querySelectorAll('#extraFields [data-field]').forEach(el => extraData[el.dataset.field] = el.value);
  }
  // Remarks textarea lives in its own section, not #extraFields
  document.querySelectorAll('#remarksSection [data-field]').forEach(el => extraData[el.dataset.field] = el.value);

  try{
    const docData = { ...extraData };
    if(!stage.fileUpload) docData.customFields = customFieldRows.filter(f => f.label || f.value);
    const updates = { header: headerData };

    // Real invoice numbering: draw the shipment's ONE invoice number from the sequential counter
    // the first time ANY real invoice document (not a Proforma) is saved for it, then every other
    // real-invoice document in this same shipment reuses that same number. This is what stops
    // Proforma-only deals from ever burning a real invoice number.
    if(REAL_INVOICE_STAGES.includes(currentStageKey) && !s.invoiceNo){
      const drawn = nextInvoiceNo();
      s.invoiceNo = drawn;
      updates.invoiceNo = drawn;
    }

    if(stage.packingItems){
      docData.packingItems = packingItemRows;
      updates.packingItems = packingItemRows; // shared at shipment level so it can pre-fill next time
      const cbmFooterEl = document.getElementById("packingTotalCBM");
      if(cbmFooterEl) docData.totalCBM = cbmFooterEl.value;
    } else if(stage.fileUpload){
      const prevDoc = (s.documents && s.documents[currentStageKey]) || {};
      if(pendingUploadFile){
        docData.fileName = pendingUploadFile.name;
        docData.fileDataUrl = pendingUploadFile.dataUrl;
      } else if(prevDoc.fileName){
        docData.fileName = prevDoc.fileName;
        docData.fileDataUrl = prevDoc.fileDataUrl;
      } else {
        toast(`Upload the ${stage.label.toLowerCase()} file before saving`, true);
        return;
      }
    } else {
      docData.items = modalItemRows;
      updates.items = modalItemRows;
    }

    updates[`documents.${currentStageKey}`] = docData;
    updates[`stages.${currentStageKey}`] = { done:true, completedAt: new Date().toISOString() };
    await localUpdate(currentShipId, updates);
    rememberReusables(headerData, extraData);

    // Catalog auto-learn
    if(stage.packingItems){
      packingItemRows.forEach(it => upsertCatalogItem({
        description: it.description, hsCode: it.hsCode, uom: it.uom,
        unitPacked: it.unitPacked, lengthIn: it.lengthIn, widthIn: it.widthIn, heightIn: it.heightIn,
        netWeightPerCtn: it.netWeightPerCtn, grossWeightPerCtn: it.grossWeightPerCtn
      }));
    } else if(stage.hasItems){
      modalItemRows.forEach(it => upsertCatalogItem({
        description: it.description, hsCode: it.hsCode, uom: it.unit, unitPrice: it.unitPrice
      }));
    }

    // Auto-post receivable: Commercial Invoice (Bank) total goes to the consignee's ledger
    if(currentStageKey === "s5"){
      const total = modalItemRows.reduce((sum,it) => sum + (parseFloat(it.qty)||0)*(parseFloat(it.unitPrice)||0), 0) + (parseFloat(extraData.extraChargeAmount)||0);
      const cons = consignees.find(c => c.id === s.consigneeId)
        || consignees.find(c => c.name.toLowerCase() === (s.customer||"").toLowerCase());
      if(total > 0 && cons){
        const autoKey = s.id + "_s5";
        // replace any previous auto entry for this shipment's invoice (re-saves shouldn't double-post)
        listConsigneeTxns().filter(t => t.autoKey === autoKey).forEach(t => deleteConsigneeTxnRecord(t.id));
        addConsigneeTxnRecord({
          consigneeId: cons.id, type: "invoice",
          date: extraData.invoiceDate || new Date().toISOString().slice(0,10),
          amount: total, currency: headerData.currency || "USD",
          shipmentRef: s.ref, autoKey,
          description: "Auto: Commercial Invoice " + (extraData.invoiceNo || s.ref)
        });
        toast("Saved — invoice total posted to " + cons.name + "'s ledger");
      }
    }

    pendingUploadFile = null;
    if(!(currentStageKey === "s5")) toast(shouldPrint ? "Saved — opening print view" : "Saved");
    if(shouldPrint) printDocument(stage, headerData, docData, s.ref, s.customer, s.routing);
    if(goToStageKey){ currentStageKey = goToStageKey; }
    refreshFromStorage();
  }catch(err){
    console.error(err);
    if(String(err.message||"").toLowerCase().includes("longer than") || String(err.message||"").toLowerCase().includes("exceeds the maximum")){
      toast("This shipment's data is too large to save (Firestore's 1MB-per-document limit) — likely too many files attached. Try removing or compressing one of the uploaded files.", true);
    } else {
      toast("Error saving document: " + err.message, true);
    }
  }
}

// ---------- Print rendering ----------
function printDocument(stage, header, docData, ref, customer, routing){
  if(stage.packingItems){
    printPackingList(header, docData, ref, customer, routing);
    return;
  }
  const itemsRows = stage.hasItems ? (docData.items||[]).map(it => {
    const qty = parseFloat(it.qty)||0, price = parseFloat(it.unitPrice)||0;
    const total = (qty*price) ? (qty*price).toFixed(2) : "";
    return `<tr>
      <td>${escapeHtml(it.description)}</td>
      <td>${escapeHtml(it.hsCode)}</td>
      <td style="text-align:right">${escapeHtml(it.qty)} ${escapeHtml(it.unit)}</td>
      <td style="text-align:right">${it.unitPrice ? (header.currency||'')+' '+escapeHtml(it.unitPrice) : ''}</td>
      <td style="text-align:right">${total ? (header.currency||'')+' '+total : ''}</td>
    </tr>`;
  }).join("") : "";

  const extraChargeAmt = parseFloat(docData.extraChargeAmount) || 0;
  const extraChargeRow = (stage.hasItems && extraChargeAmt) ? `<tr>
      <td colspan="4" style="text-align:right;font-style:italic;">${escapeHtml(docData.extraChargeLabel || "Additional Charge")}</td>
      <td style="text-align:right;font-style:italic;">${escapeHtml(header.currency||'')} ${extraChargeAmt.toFixed(2)}</td>
    </tr>` : "";

  const itemsSubtotal = stage.hasItems ? (docData.items||[]).reduce((sum,it) => sum + (parseFloat(it.qty)||0)*(parseFloat(it.unitPrice)||0), 0) : 0;
  const grandTotal = itemsSubtotal + extraChargeAmt;

  const itemsTable = stage.hasItems ? `
    <table class="doc-items">
      <thead><tr><th>Description</th><th>HS Code</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
      <tbody>${itemsRows}${extraChargeRow}</tbody>
      ${grandTotal ? `<tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">Grand Total</td><td style="text-align:right;font-weight:700">${escapeHtml(header.currency||'')} ${grandTotal.toFixed(2)}</td></tr></tfoot>` : ""}
