  const letterheadAddress = docData.issuerAddress || header.exporterAddress || "";

  const bankFieldDefs = [
    {name:"bankBeneficiary", label:"Account Title"},

    {name:"bankName", label:"Bank Name"},

  const bankRows = bankFieldDefs.map(f => docData[f.name] ? `<div class="doc-field"><span>${f.label}:</span><b>${escapeHtml(docData[f.name])}</b></div>` : "").join("");

  const remarksPrintBlock = docData.remarks ? `

  const customPrintRows = (docData.customFields||[]).filter(f => f.label && f.value)
    .map(f => `<div class="doc-field"><span>${escapeHtml(f.label)}:</span><b>${escapeHtml(f.value)}</b></div>`).join("");
  const customFieldsPrintBlock = customPrintRows ? `
    <div class="section-label">Additional Info</div>

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(stage.label)} - ${escapeHtml(ref)}</title>

  </style></head>
  <body>
    <div class="doc-header">

}

// Packing list print — matches Babji Manufacturing layout
function printPackingList(header, docData, ref, customer, routing){
  const items = docData.packingItems || [];
  // UAE routing: the packing list goes to Saif Al Sahra (the buyer on this leg).
  const plBuyer = routing !== "direct" ? SAIF_ENTITY : (docData.buyerOverride || customer || "");
  const plBuyerAddr = routing !== "direct" ? ((getSettings().exporterAddresses||{})[SAIF_ENTITY] || "") : (header.buyerAddress || "");
  let totPacked=0, totUOM=0, totCBM=0, totNet=0, totGross=0;
  const rows = items.map((it, i) => {
    const tp = parseFloat(it.totalPacked)||0;
    const uom = parseFloat(it.qty) || ((parseFloat(it.unitPacked)||0) * tp); // actual qty if set, else Cartons × Unit Packed
    const L = parseFloat(it.lengthIn)||0, W = parseFloat(it.widthIn)||0, H = parseFloat(it.heightIn)||0;
    const cbmPerCtn = (L*W*H) * 0.000016387064; // cubic inches -> m3
    const netPerCtn = parseFloat(it.netWeightPerCtn)||0, grossPerCtn = parseFloat(it.grossWeightPerCtn)||0;
    const cbm = parseFloat(it.totalCBM) || (cbmPerCtn*tp), net = netPerCtn*tp, gross = grossPerCtn*tp;
    totPacked += tp; totUOM += uom; totCBM += cbm; totNet += net; totGross += gross;
    return `<tr>
      <td style="text-align:center">${i+1}</td>
      <td style="text-align:center">${escapeHtml(it.hsCode)}</td>
      <td>${escapeHtml(it.description)}</td>
      <td style="text-align:center">${escapeHtml(it.uom)}</td>
      <td style="text-align:center">${escapeHtml(it.unitPacked)}</td>
      <td style="text-align:center">${escapeHtml(it.packingType)}</td>
      <td style="text-align:center">${tp ? tp.toLocaleString() : ''}</td>
      <td style="text-align:center">${uom ? uom.toLocaleString() : ''}</td>
      <td style="text-align:center">${cbm ? cbm.toFixed(2) : ''}</td>
      <td style="text-align:center">${net ? net.toFixed(1) : ''}</td>
      <td style="text-align:center">${gross ? gross.toFixed(1) : ''}</td>
    </tr>`;
  }).join("");

  const isDraft = docData.packingStatus && docData.packingStatus.startsWith("Draft");
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Packing List - ${escapeHtml(ref)}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;padding:26px;max-width:1000px;margin:0 auto;position:relative;}
    .company{text-align:center;}
    .company h1{margin:0;font-size:1.5rem;letter-spacing:.5px;}
    .company .addr{font-size:.72rem;font-weight:700;margin-top:4px;}
    h2.doctitle{text-align:center;font-weight:400;font-size:1.25rem;margin:22px 0 18px;letter-spacing:1px;}
    .meta{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:16px;}
    .meta .block div{margin-bottom:3px;}
    .meta b{text-decoration:underline;}
    table{width:100%;border-collapse:collapse;font-size:.74rem;}
    th,td{border:1px solid #333;padding:5px 5px;}
    th{background:#f5f5f5;text-align:center;}
    tfoot td{font-weight:700;}
    .sig{margin-top:70px;width:280px;}
    .sig .line{border-top:1px solid #333;text-align:center;padding-top:5px;font-size:.8rem;}
    .section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:#888;font-weight:700;margin:18px 0 8px;border-top:1px solid #ddd;padding-top:12px;}
    .doc-fields{display:flex;flex-wrap:wrap;gap:10px 26px;}
    .doc-field{font-size:.85rem;display:flex;gap:6px;}
    .doc-field span{color:#666;}
    .draft-banner{background:#fff4e5;border:2px solid #e0a324;color:#7a5200;text-align:center;font-weight:700;padding:8px;margin-bottom:16px;font-size:.85rem;letter-spacing:.5px;}
    .draft-watermark{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:5rem;font-weight:800;color:rgba(200,50,50,0.15);z-index:-1;white-space:nowrap;pointer-events:none;}
    @media print{ body{padding:8mm;} .draft-watermark{position:fixed;} }
  </style></head>
  <body>
    ${isDraft ? '<div class="draft-watermark">DRAFT — NOT FINAL</div>' : ''}
    ${isDraft ? '<div class="draft-banner">⚠ DRAFT / PROVISIONAL — Packing not yet finalized. Figures subject to change.</div>' : ''}
    <div class="company">
      <h1>${escapeHtml(header.exporterEntity||'BABJI MANUFACTURING').toUpperCase()}</h1>
      <div class="addr">${escapeHtml(header.exporterAddress||'')}</div>
    </div>
    <h2 class="doctitle">PACKING LIST</h2>
    <div class="meta">
      <div class="block">
        <div><b>To/Buyer:</b></div>
        <div>${escapeHtml(plBuyer)}</div>
        <div><b>Address:</b></div>
        <div>${escapeHtml(plBuyerAddr)}</div>
      </div>
      <div class="block">
        <div><b>Loading Port:</b></div>
        <div>${escapeHtml(header.portOfLoading||'')}</div>
        <div><b>Destination Port:</b></div>
        <div>${escapeHtml(header.portOfDischarge||'')}</div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Sr.No</th><th>HS CODE</th><th>ITEM DESCRIPTION</th><th>UOM</th><th>Unit Packed</th><th>Packing Type</th><th>Total Qty (Packed)</th><th>Total Qty (UOM)</th><th>Total CBM</th><th>Net Wt (kg)</th><th>Gross Wt (kg)</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr>
          <td colspan="2" style="text-align:center">Container #<br>${escapeHtml(docData.containerNo||'')}</td>
          <td colspan="4" style="text-align:center">Total ${escapeHtml(docData.containerType||'')}</td>
          <td style="text-align:center">${totPacked.toLocaleString()}</td>
          <td style="text-align:center">${totUOM.toLocaleString()}</td>
          <td style="text-align:center">${(docData.totalCBM != null && docData.totalCBM !== "") ? escapeHtml(docData.totalCBM) : totCBM.toFixed(2)}</td>
          <td style="text-align:center">${totNet.toFixed(1)}</td>
          <td style="text-align:center">${totGross.toFixed(1)}</td>
        </tr>
      </tfoot>
    </table>
    ${docData.remarks ? `<div class="section-label">Remarks</div><div style="font-size:.85rem;white-space:pre-wrap;">${escapeHtml(docData.remarks)}</div>` : ''}
    ${(docData.customFields||[]).filter(f=>f.label&&f.value).length ? `<div class="section-label">Additional Info</div><div class="doc-fields">${(docData.customFields||[]).filter(f=>f.label&&f.value).map(f=>`<div class="doc-field"><span>${escapeHtml(f.label)}:</span><b>${escapeHtml(f.value)}</b></div>`).join("")}</div>` : ''}
    <div class="sig">
      <div class="line">${escapeHtml(header.exporterEntity||'BABJI MANUFACTURING').toUpperCase()}</div>
    </div>
  </body></html>`;

  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

// Surface any otherwise-silent write failure (e.g. Firestore security rules not set up yet)
window.addEventListener("unhandledrejection", (event) => {
  console.error("Unhandled error:", event.reason);
  const msg = (event.reason && event.reason.message) ? event.reason.message : "something went wrong talking to the cloud";
  toast("Error: " + msg, true);
});

// ================= FIREBASE BOOTSTRAP: AUTH + LIVE LISTENERS =================
let activeListenerUnsubs = [];

function attachLiveListeners(){
  activeListenerUnsubs.push(onSnapshot(query(collection(db, SHIP_COL), orderBy("createdAt", "desc")), snap => {
    shipments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (shipments): " + err.message, true); }));

  activeListenerUnsubs.push(onSnapshot(collection(db, PROVIDER_COL), snap => {
    providers = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0));
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (providers): " + err.message, true); }));

  activeListenerUnsubs.push(onSnapshot(collection(db, TXN_COL), snap => {
    txnsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (expenses): " + err.message, true); }));

  activeListenerUnsubs.push(onSnapshot(collection(db, CONSIGNEE_COL), snap => {
    consignees = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0));
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (consignees): " + err.message, true); }));

  activeListenerUnsubs.push(onSnapshot(collection(db, CTXN_COL), snap => {
    consigneeTxnsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (receivables): " + err.message, true); }));

  activeListenerUnsubs.push(onSnapshot(collection(db, CATALOG_COL), snap => {
    catalogCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (catalog): " + err.message, true); }));

  activeListenerUnsubs.push(onSnapshot(doc(db, "appSettings", SETTINGS_DOC_ID), snap => {
    settingsCache = snap.exists() ? snap.data() : {};
    renderApp();
  }, err => { console.error(err); if(authUser) toast("Sync error (settings): " + err.message, true); }));
}

// Properly stop every live listener — called on logout so they don't linger and fail
// against the now-signed-out session (which was showing a scary but harmless error).
function detachLiveListeners(){
  activeListenerUnsubs.forEach(unsub => { try{ unsub(); }catch(e){} });
  activeListenerUnsubs = [];
}

if(CONFIG_IS_PLACEHOLDER){
  renderApp(); // show the "replace firebaseConfig" banner immediately, no auth attempt
} else {
  onAuthStateChanged(auth, user => {
    authUser = user;
    if(!user){
      authReady = false;
      detachLiveListeners();
      renderApp(); // shows the login screen
      return;
    }
    authReady = true;
    attachLiveListeners();
    renderApp();
  });
}
